name: Deploy Website VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy to production manually after any required migration step
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-website-main
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check schema and migration coherence
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git show --pretty='' --name-only "$AFTER_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          printf 'Changed files:\n%s\n' "$changed_files"

          schema_pattern='^(src/collections/|src/globals/|src/Footer/|src/Header/|src/payload\.config\.ts$)'
          migration_pattern='^src/migrations/'

          schema_changed=false
          migration_changed=false

          if printf '%s\n' "$changed_files" | grep -E "$schema_pattern" >/dev/null; then
            schema_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -E "$migration_pattern" >/dev/null; then
            migration_changed=true
          fi

          if $schema_changed && $migration_changed; then
            echo "Schema files changed and migration files detected — migrations will run on deploy."

          elif $schema_changed && ! $migration_changed; then
            echo "::error::Schema-sensitive files changed but no migration file found in this push."
            echo "::error::Run pnpm db:migrate:create locally, commit the migration, and push again."
            exit 1

          elif ! $schema_changed && $migration_changed; then
            echo "Migration-only change — safe to deploy."

          else
            echo "No schema or migration changes — safe to deploy."
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production website
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "cd '$DEPLOY_APP_DIR' && ./scripts/deploy-vps.sh --branch main"

  deploy-production-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-website-main-manual
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production website manually
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "cd '$DEPLOY_APP_DIR' && ./scripts/deploy-vps.sh --branch '$DEPLOY_REF'"
